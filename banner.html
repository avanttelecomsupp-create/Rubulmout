<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Cover Banner — rubulmout.avantgroups.in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
      padding: 20px;
    }

    .helper-note {
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    /* Exact Facebook OG Image Dimensions: 1200px x 630px */
    .fb-banner {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #091929 0%, #0f2942 55%, #183d61 100%);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.45fr 0.85fr;
      padding: 54px 60px;
      gap: 40px;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    /* Decorative Gold Accent Bar on Left Edge */
    .fb-banner::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 12px;
      background: linear-gradient(180deg, #facc15 0%, #c59b27 100%);
    }

    /* Subtle Geometric Circle Glow */
    .fb-banner::after {
      content: "";
      position: absolute;
      right: -120px;
      top: -120px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(197, 155, 39, 0.16) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Left Column */
    .banner-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      z-index: 2;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(250, 204, 21, 0.14);
      border: 1px solid rgba(250, 204, 21, 0.45);
      color: #facc15;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      width: fit-content;
    }

    .main-copy h1 {
      color: #ffffff;
      font-size: 3.1rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .main-copy h1 span {
      color: #facc15;
    }

    .assamese-sub {
      color: #e2e8f0;
      font-size: 1.45rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .tagline {
      color: #cbd5e1;
      font-size: 1.12rem;
      line-height: 1.5;
      max-width: 650px;
    }

    .banner-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }

    .url-box {
      background: #c59b27;
      color: #091929;
      font-weight: 800;
      font-size: 1.25rem;
      padding: 12px 24px;
      border-radius: 8px;
      letter-spacing: 0.3px;
    }

    .host-credit {
      text-align: right;
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .host-credit strong {
      display: block;
      color: #ffffff;
      font-size: 0.98rem;
    }

    /* Right Column: Portrait Card */
    .banner-right {
      z-index: 2;
      display: flex;
      justify-content: center;
    }
